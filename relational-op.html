<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script type="text/javascript">
        var a = 10;
        var b = 20;
        var linebreak = "<br/>";

        document.write("(a < b) => " + (a < b) + linebreak);
        // result = (a < b);
        // document.write("Result is: " + result);
        // document.write(linebreak);
        document.write("(a > b) => " + (a > b) + linebreak);
        document.write("(a <= b) => " + (a <= b) + linebreak);
        document.write("(a >= b) => " + (a >= b) + linebreak);
        document.write("(a != b) => " + (a != b) + linebreak);
        document.write("(a == b) => " + (a == b) + linebreak);
        
        document.write("(a === b) => " + (a === b) + linebreak);

        
        
    </script>
</body>

</html>
