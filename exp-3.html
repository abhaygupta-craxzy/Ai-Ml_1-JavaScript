<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp-3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 50px;
            border: 2px solid #333;
            border-radius: 10px;
            background: linear-gradient(to bottom, #76f5a3, #ffffff);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 5px;
            margin-bottom: 20px;
            width: 60%;
        }

        .btn {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: rgb(37, 182, 145);
            border: 2px solid #333;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 id="heading">Welcome to JavaScript Lab</h1>

        <input type="text" id="textInput" placeholder="Enter new heading text">
        <br>

        <button class="btn" id="headingBtn">Change Heading</button>
        <button class="btn" id="bgColorBtn">Change Background</button>
        <button class="btn" id="fontSizeBtn">Increase Font Size</button>
        <br>
        <button class="btn" id="toggleParaBtn">Show/Hide Paragraph</button>
        <button class="btn" id="resetBtn">Reset</button>

        <p id="para">
            This is a sample paragraph. JavaScript events can dynamically change content.
        </p>
    </div>

    <script>

        let heading = document.getElementById("heading");
        let para = document.getElementById("para");
        let fontSize = 16;


        document.getElementById("headingBtn").addEventListener("click", function () {
            let text = document.getElementById("textInput").value;
            if (text.trim() !== "") {
                heading.textContent = text;
            }
        });

        document.getElementById("bgColorBtn").addEventListener("click", function () {
            document.body.style.backgroundColor = "#" + Math.floor(Math.random() * 16777215).toString(16);
        });

        document.getElementById("fontSizeBtn").addEventListener("click", function () {
            fontSize += 2;
            para.style.fontSize = fontSize + "px";
        });

        document.getElementById("toggleParaBtn").addEventListener("click", function () {
            if (para.style.display === "none") {
                para.style.display = "block";
            } else {
                para.style.display = "none";
            }
        });

        document.getElementById("resetBtn").addEventListener("click", function () {
            heading.innerHTML = "Welcome to JavaScript Lab";
            document.body.style.backgroundColor = "#ffffff";
            fontSize = 16;
            para.style.fontSize = fontSize + "px";
            para.style.display = "block";
        });
    </script>
</body>

</html>
