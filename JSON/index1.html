<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON First class</title>
</head>
<body>
    <h2>Class object from JSON String</h2>

    <p id = "demo"></p>

    <script>
        var text = '{"employee": {"firstname": "John", "lastname": "Doe"}}'+ '{"employee": {"firstname": "Anna", "lastname": "Smith"}}'+ '{"employee": {"firstname": "Peter", "lastname": "Jones"}}';
        var obj = JSON.parse(text);
        document.getElementById("demo").innerHTML = obj.employee.firstname + " " + obj.employee.lastname;
    </script>

</body>
</html>
