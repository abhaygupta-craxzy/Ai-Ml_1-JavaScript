<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body onload="onLoad()">
    
    <h1>HTML DOM Forms</h1>
    <p id="demo"></p>
    <form id="myForm">
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="fname"><br>
        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lname"><br><br>
        <input type="submit" value="Submit">
      </form>

      <script>
        const x = document.addEventListener("input");
        x.addEventListener('focus',onHandlefocus);
        x.addEventListener('blur',onHandleblur);

        function onHandlefocus(){
           onHandlefocus.style.backgroundColor = "red";
        }

        function onHandleblur(){
            onHandleblur.style.backgroundColor = "blue";
            x.style.borderColor = "purple";
        }


//----------- window.onload event handler -----------//

        function onLoad(){
           alert("Page is loaded"); 
        }

      </script>
</body>
</html>
